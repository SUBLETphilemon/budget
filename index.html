<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon espace">
<title>Mon espace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --tile: #1a1a1c;
    --tile-2: #242427;
    --text: #f2f2f0;
    --muted: #8d8d93;
    --radius: 26px;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  a:focus-visible { outline: 2px solid #9fbbdc; outline-offset: 4px; }

  .hub { width: 100%; max-width: 760px; }
  .hello { font-size: clamp(28px, 5vw, 38px); font-weight: 200; letter-spacing: -.02em; line-height: 1.15; }
  .date { color: var(--muted); margin: 6px 0 28px; text-transform: capitalize; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .choice {
    background: var(--tile);
    border-radius: var(--radius);
    padding: 26px;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--text);
    text-decoration: none;
    transition: background .15s, transform .15s;
  }
  .choice:hover { background: var(--tile-2); }
  .choice:active { transform: scale(.98); }
  .ico { width: 54px; height: 54px; border-radius: 16px; background: #2c2c31; display: grid; place-items: center; }
  .ico svg { width: 28px; height: 28px; opacity: .88; }
  .choice b { display: block; font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
  .choice span.d { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }

  @media (max-width: 600px) {
    .choices { grid-template-columns: 1fr; gap: 12px; }
    .choice { min-height: 170px; padding: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="hub">
  <h1 class="hello" id="hello">Bonjour</h1>
  <p class="date" id="date"></p>

  <nav class="choices" aria-label="Applications">
    <a class="choice" href="dashboard.html">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg></span>
      <span><b>Dashboard</b><span class="d">Heure, météo, actus, minuteur, notes</span></span>
    </a>
    <a class="choice" href="budget.html">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.2a3.5 3.5 0 1 0 0 5.6M7.5 11h5.5M7.5 13h5.5"/></svg></span>
      <span><b>Budget</b><span class="d">Dépenses, épargne, bilans</span></span>
    </a>
  </nav>
</main>
<script>
  (function () {
    var d = new Date(), h = d.getHours();
    document.getElementById('hello').textContent = h >= 18 || h < 5 ? 'Bonsoir' : 'Bonjour';
    document.getElementById('date').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  })();
</script>
</body>
</html>
